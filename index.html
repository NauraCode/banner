<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Jasa Coding IT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💻</text></svg>"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Neo-brutalism bertema coding: latar navy ala code editor dengan garis diagonal berjalan,
   kartu kertas bergaris tinta, kartu profil berbentuk jendela terminal.
   Palet: ink, paper, navy (latar), terminal green (sorot), lemon, tomato, sky, pink. */
      :root {
        --ink: #0b0d1a;
        --paper: #f7f8ff;
        --navy-a: #10163a;
        --navy-b: #172055;
        --green: #3dff95;
        --lemon: #ffe629;
        --tomato: #ff5a3c;
        --orange: #ffb347;
        --blue: #5297fd;
        --sky: #5cc8ff;
        --pink: #ff8fd8;
        --font-display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
        --font-body: "DM Sans", system-ui, sans-serif;
        --font-mono: "Space Mono", ui-monospace, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        font-family: var(--font-body);
        color: var(--ink);
        background: var(--navy-a);
        min-height: 100vh;
        overflow-x: hidden;
        padding: max(36px, env(safe-area-inset-top))
          max(16px, env(safe-area-inset-left))
          max(32px, env(safe-area-inset-bottom))
          max(16px, env(safe-area-inset-right));
      }
      .bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          -45deg,
          var(--navy-a) 0 28px,
          var(--navy-b) 28px 56px
        );
        background-size: 79.2px 79.2px;
        animation: stripes 2.6s linear infinite;
      }
      @keyframes stripes {
        to {
          background-position: 79.2px 0;
        }
      }

      main {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 440px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .card {
        background: var(--paper);
        border: 3px solid var(--ink);
        box-shadow: 6px 6px 0 var(--green);
        border-radius: 8px;
      }

      /* kartu profil = jendela terminal */
      .profile {
        overflow: hidden;
        transform: rotate(-1deg);
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 9px 12px;
        background: var(--ink);
        color: #9aa3d8;
        font: 700 12px var(--font-mono);
      }
      .bar i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 2px solid var(--paper);
      }
      .bar i:nth-child(1) {
        background: var(--tomato);
      }
      .bar i:nth-child(2) {
        background: var(--lemon);
      }
      .bar i:nth-child(3) {
        background: var(--green);
      }
      .bar span {
        margin-left: 6px;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .body {
        padding: 22px 20px 22px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        text-align: center;
      }
      .avatar {
        width: 88px;
        height: 88px;
        display: grid;
        place-items: center;
        font: 700 30px var(--font-mono);
        letter-spacing: -2px;
        background: var(--ink);
        color: var(--green);
        border: 3px solid var(--ink);
        border-radius: 14px;
        box-shadow: 4px 4px 0 var(--lemon);
        transform: rotate(3deg);
      }
      h1 {
        font: 800 30px/1.05 var(--font-display);
        margin: 8px 0 0;
        text-wrap: balance;
        overflow-wrap: anywhere;
      }
      .handle {
        margin: 0;
        padding: 2px 10px;
        border-radius: 4px;
        background: var(--ink);
        color: var(--green);
        font: 700 13px var(--font-mono);
      }
      .bio {
        margin: 2px 0 0;
        font: 700 14px/1.5 var(--font-mono);
      }
      .bio::before {
        content: "$ ";
        color: var(--tomato);
      }
      .bio::after {
        content: "";
        display: inline-block;
        width: 0.6em;
        height: 1.05em;
        margin-left: 3px;
        vertical-align: -0.18em;
        background: var(--ink);
        animation: blink 1s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin-top: 4px;
      }
      .chip {
        font: 700 12px var(--font-mono);
        padding: 4px 10px;
        border: 2px solid var(--ink);
        border-radius: 4px;
      }
      .chip:nth-child(1) {
        background: var(--sky);
      }
      .chip:nth-child(2) {
        background: var(--pink);
      }
      .chip:nth-child(3) {
        background: var(--lemon);
      }
      .chip:nth-child(4) {
        background: var(--green);
      }
      .chip:nth-child(5) {
        background: var(--blue);
      }
      .chip:nth-child(6) {
        background: var(--orange);
      }

      .links {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .link {
        display: flex;
        align-items: center;
        gap: 14px;
        min-height: 64px;
        padding: 10px 16px 10px 12px;
        color: var(--ink);
        text-decoration: none;
        transition:
          transform 0.12s ease,
          box-shadow 0.12s ease,
          background 0.12s ease;
      }
      .link:hover,
      .link:focus-visible {
        transform: translate(-3px, -3px);
        box-shadow: 9px 9px 0 var(--green);
        background: var(--lemon);
      }
      .link:active {
        transform: translate(4px, 4px);
        box-shadow: 2px 2px 0 var(--green);
      }
      .link:focus-visible {
        outline: 3px solid var(--green);
        outline-offset: 3px;
      }
      li:nth-child(1) .icon {
        background: var(--pink);
      }
      li:nth-child(2) .icon {
        background: var(--green);
      }
      li:nth-child(3) .icon {
        background: var(--sky);
      }
      li:nth-child(4) .icon {
        background: var(--lemon);
      }
      li:nth-child(n + 5) .icon {
        background: var(--tomato);
      }
      .icon {
        flex: none;
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border: 3px solid var(--ink);
        border-radius: 8px;
      }
      .link:hover .icon,
      .link:focus-visible .icon {
        background: var(--paper);
      }
      .icon svg {
        width: 20px;
        height: 20px;
      }
      .text {
        min-width: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .title {
        font: 800 17px/1.2 var(--font-display);
        overflow-wrap: anywhere;
      }
      .sub {
        font: 700 12px var(--font-mono);
        opacity: 0.7;
        overflow-wrap: anywhere;
      }
      .arrow {
        flex: none;
        width: 20px;
        height: 20px;
      }

      footer {
        align-self: center;
        padding: 4px 12px;
        background: var(--green);
        color: var(--ink);
        border: 2px solid var(--ink);
        border-radius: 4px;
        font: 700 12px var(--font-mono);
      }

      @media (prefers-reduced-motion: reduce) {
        .bg,
        .bio::after {
          animation: none;
        }
        .link {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>

    <main>
      <header class="profile card">
        <div class="bar" aria-hidden="true">
          <i></i><i></i><i></i><span id="term">nauracode &mdash; zsh</span>
        </div>
        <div class="body">
          <div class="avatar" aria-hidden="true">&lt;/&gt;</div>
          <h1 id="name"></h1>
          <p class="handle" id="handle"></p>
          <p class="bio" id="bio"></p>
          <div class="chips" id="chips"></div>
        </div>
      </header>

      <ul class="links" id="links"></ul>
      <footer id="foot"></footer>
    </main>

    <script>
      /* Ubah bagian ini saja: nama, bio, layanan, dan daftar link. */
      var PROFILE = {
        name: "JasaCodingIT",
        handle: "@nauracode",
        bio: "Digital Solutions for Your Needs",
        services: [
          "Website",
          "Mobile App",
          "API",
          "Database",
          "Bug Fixing",
          "Documentation",
        ],
        links: [
          {
            icon: "music",
            title: "TikTok",
            sub: "@nauracode · tips & humor coding",
            url: "https://www.tiktok.com/@nauracode",
          },
          {
            icon: "chat",
            title: "Pesan Jasa",
            sub: "Chat WhatsApp untuk order",
            url: "https://wa.me/+6281234567890",
          },
          {
            icon: "code",
            title: "Portofolio",
            sub: "Contoh project yang sudah jadi",
            url: "portfolio.html",
            internal: true,
          },
          {
            icon: "tag",
            title: "Daftar Harga",
            sub: "Paket web, mobile, API, database",
            url: "https://pabrikode.com/",
          },
        ],
      };

      var ICONS = {
        music:
          '<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',
        chat: '<path d="M4 5h16a1 1 0 011 1v10a1 1 0 01-1 1H10l-5 4v-4H4a1 1 0 01-1-1V6a1 1 0 011-1z"/>',
        code: '<path d="M8 7l-5 5 5 5"/><path d="M16 7l5 5-5 5"/><path d="M14 5l-4 14"/>',
        tag: '<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.2" fill="currentColor"/>',
        link: '<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3A4 4 0 0011 18.7l1-1"/>',
      };

      document.getElementById("name").textContent = PROFILE.name;
      document.getElementById("handle").textContent = PROFILE.handle;
      document.getElementById("bio").textContent = PROFILE.bio;
      document.getElementById("foot").textContent =
        "built by " + "NauraCode" + " @" + new Date().getFullYear();

      var chips = document.getElementById("chips");
      PROFILE.services.forEach(function (s) {
        var c = document.createElement("span");
        c.className = "chip";
        c.textContent = s;
        chips.appendChild(c);
      });

      var list = document.getElementById("links");
      PROFILE.links.forEach(function (l) {
        var li = document.createElement("li");
        var a = document.createElement("a");
        a.className = "link card";
        a.href = l.url;
        if (!l.internal) {
          a.target = "_blank";
          a.rel = "noopener noreferrer";
        }
        a.innerHTML =
          '<span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          (ICONS[l.icon] || ICONS.link) +
          "</svg></span>" +
          '<span class="text"><span class="title"></span><span class="sub"></span></span>' +
          '<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
        a.querySelector(".title").textContent = l.title;
        a.querySelector(".sub").textContent = l.sub || "";
        li.appendChild(a);
        list.appendChild(li);
      });
    </script>
  </body>
</html>
